name: Build Docker Images

on:
  push:
    branches: [ staging, main ]

jobs:
  build:
    name: Test Docker Compose Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env for build
      run: |
        echo "GEMINI_API_KEY=test" >> .env
        echo "OPENROUTER_API_KEY=test" >> .env
        echo "JWT_SECRET_KEY=test" >> .env
        echo "VITE_API_URL=http://localhost:8000" >> .env
        echo "VITE_GOOGLE_CLIENT_ID=test" >> .env

    - name: Build Docker Compose
      run: docker-compose build

    - name: Verify images
      run: docker images

    - name: Build successful
      run: |
        echo "✅ Docker Compose build completed successfully!"
        echo "All services built: backend, frontend, db"
