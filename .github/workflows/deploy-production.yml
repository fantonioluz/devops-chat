name: Deploy to Production

# Desabilitado temporariamente - Configure o Railway primeiro
# Remova os comentários quando o projeto estiver criado no Railway
on:
  workflow_dispatch: # Apenas manual por enquanto
  # push:
  #   branches: [ main ]

jobs:
  deploy:
    name: Deploy to Railway (Production)
    runs-on: ubuntu-latest
    # environment: production # Crie este environment no GitHub Settings
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Railway CLI
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
      run: npm install -g @railway/cli

    - name: Deploy to Railway (Docker Compose)
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
      run: |
        railway up --environment production

    - name: Create Release Tag
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        TAG_NAME="v$(date +'%Y.%m.%d')-${{ github.run_number }}"
        git tag $TAG_NAME
        git push origin $TAG_NAME

    - name: Notify deployment
      run: |
        echo "✅ Deployment to production completed successfully!"
        echo "Services: Backend + Frontend + PostgreSQL (Docker Compose)"
        echo "Environment: Railway production"
