name: Deploy to Staging

# Desabilitado temporariamente - Configure o Railway primeiro
# Remova os comentários quando o projeto estiver criado no Railway
on:
  workflow_dispatch: # Apenas manual por enquanto
  # push:
  #   branches: [ staging ]

jobs:
  deploy:
    name: Deploy to Railway (Staging)
    runs-on: ubuntu-latest
    # environment: staging # Crie este environment no GitHub Settings
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Railway CLI
      run: npm install -g @railway/cli

    - name: Deploy to Railway (Docker Compose)
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      run: |
        railway up --environment staging

    - name: Notify deployment
      run: |
        echo "✅ Deployment to staging completed successfully!"
        echo "Services: Backend + Frontend + PostgreSQL (Docker Compose)"
        echo "Environment: Railway staging"
