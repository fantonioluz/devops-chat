name: Test and Build Staging

on:
  push:
    branches: [ staging ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8

    - name: Run backend tests
      working-directory: ./backend
      env:
        TEST_MODE: "true"
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        pytest --cov=. --cov-report=term-missing

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build frontend
      working-directory: ./frontend
      env:
        VITE_API_URL: http://test.example.com:8000
        VITE_GOOGLE_CLIENT_ID: test-client-id
      run: npm run build

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend image
      working-directory: ./backend
      run: |
        docker build -t devops-chat-backend:staging-${{ github.sha }} .
        echo "✅ Backend image built successfully"

    - name: Build Frontend image
      working-directory: ./frontend
      run: |
        docker build \
          --build-arg VITE_API_URL=http://test.example.com:8000 \
          --build-arg VITE_GOOGLE_CLIENT_ID=test-client-id \
          -t devops-chat-frontend:staging-${{ github.sha }} .
        echo "✅ Frontend image built successfully"

    - name: Build Summary
      run: |
        echo "✅ All tests passed and images built successfully!"
        echo ""
        echo "📦 Images:"
        echo "  Backend: devops-chat-backend:staging-${{ github.sha }}"
        echo "  Frontend: devops-chat-frontend:staging-${{ github.sha }}"
        echo ""
        echo "🚀 Ready to merge to main for production deployment"
